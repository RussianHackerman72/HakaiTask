plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.focusguard'
version = '0.1.0'

android {
  namespace "expo.modules.focusguard"
  defaultConfig {
    // `expo-module-gradle-plugin` MEWAJIBKAN dua ini. Tanpa versionName,
    // konfigurasi project-nya gagal dengan
    // "'android.defaultConfig.versionName' is not defined" — dan pesannya
    // muncul sebagai kegagalan plugin expo-autolinking, jauh dari sebabnya.
    versionCode 1
    versionName '0.1.0'
  }
}
